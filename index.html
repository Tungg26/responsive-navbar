## Mục tiêu:
Luyện tập sử dụng thuộc tính `grid-row` để thay đổi vị trí và kích thước của một Grid Item.
## Bài toán:
Tạo một Grid gồm **3 cột và 3 hàng**, sau đó sử dụng `grid-row` để cho một ô chiếm **2 hàng liên tiếp**.
### HTML:
```html
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="grid-container">
        <div class="item item1">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>
</body>

</html>
